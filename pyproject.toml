[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unitree-rl-mjlab"
version = "0.0.1"
description = "Reinforcement learning environments for Unitree robots built on mjlab."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "mjlab==1.5.3",
    "mujoco-warp>=3.10.0.3,<3.11",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
src = [
    "assets/**/*.csv",
    "assets/**/*.obj",
    "assets/**/*.urdf",
    "assets/**/*.xml",
]
